<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="png" href="canban.png">
    <title>Canban Desk</title>
    <script src="index.js" defer></script>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header" class="header">
        <h1>МОЯ ДОСКА</h1>
        <button id="openModal" class="createTask">Создать задачу</button>
        <a class="navigation" href="stats.html">Статистика</a>
        <!-- <form id ="form" class="add-card-form">
            <input id = "input" type="text" name="title" placeholder="Название Задачи" required>
            <button type="submit">Добавить задачу</button>

        </form> -->
    </header>
    <dialog id="modal" class="modal">
        <form id ="form" method="dialog" class="add-card-form">
            <p>Введите название задачи</p>
            <input id = "input"  type="text" name="title" required>
            <p>Введите начальное время</p>
            <input id="inputTimeStart" type="date" name="timeStart">
            <p>Введите конечное время</p>
            <input id="inputTimeEnd"  type="date" name="timeEnd">
            <p>Выберите приоритет</p>
        <select id="inputPriority" name="priority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
        </select>
            <div class="modalBtn">
                <button type="submit">Добавить задачу</button>
                <button type="button" id="closeBtn">Отмена</button>
            </div>
        </form>
    </dialog>
    <dialog class ="modal" id="timeLogicModal">
        <p id="timeLogicModalText">Время окончания задачи не может быть меньше времени начала задачи</p>
        <button id="closeTimeLogicModal" class="modalBtn">Закрыть</button>
    </dialog>
    <dialog id="deleteConfirmationModal" class="modal">
        <p>Вы уверены, что хотите удалить задачу?</p>
        <div class="modalBtn">
            <button id="confirmDelete" class="modalBtn">Да</button>
        </div>
    </dialog>
    <main id="main" class="main">
        <section id="toDo" class="column">
            <h2 class="column-title">TO DO</h2>
            <ul id="toDoUl" class="column-list" data-action="todo"></ul>
        </section>
        <section id="inProgress" class="column">
            <h2 class="column-title">IN PROGRESS</h2>
            <ul id="inProgressUl" data-action="inProgress" class="column-list"></ul>
        </section>
        <section id="done" class="column">
            <h2 class="column-title">DONE</h2>
            <ul id="doneUl" class="column-list" data-action="done"></ul>
        </section>
    </main>
</body>
</html>
